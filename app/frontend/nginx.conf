server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ─────────────────────────────────────────────
    # Proxy /api/ calls to backend service
    # Nginx resolves this using Kubernetes internal DNS
    # ─────────────────────────────────────────────
    location /api/ {
        proxy_pass http://cloud-native-backend.backend.svc.cluster.local:3500/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ─────────────────────────────────────────────
    # React Router — always serve index.html
    # so React handles client-side routing
    # ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
